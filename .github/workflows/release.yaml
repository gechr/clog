name: release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions: {}

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    uses: gechr/actions/.github/workflows/release-notes.yaml@854917523e0f0f5208e64c557bd645509944170b # v0.2.6
