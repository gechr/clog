name: release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions: {}

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    # clover: provider=auto
    uses: gechr/actions/.github/workflows/release-notes.yaml@b670f2c89a30f7ab050bcffbf2177459ca63520b # v0.2.8
