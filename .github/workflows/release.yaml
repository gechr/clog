name: release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions: {}

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    # @clover
    uses: gechr/actions/.github/workflows/release-notes.yaml@b90a8ef9841510cc6325daf17d38e768d57d17b3 # v0.2.12
