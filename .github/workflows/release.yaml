name: release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions: {}

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    uses: gechr/actions/.github/workflows/release-notes.yaml@9b9d051d433bfeb57bf7f88c65c41ae3cb23e000 # v0.2.7
