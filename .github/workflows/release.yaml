name: release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions: {}

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    # @clover
    uses: gechr/actions/.github/workflows/release-notes.yaml@9c4087072c6cce173946d4546aa18625a317a7b0 # v0.2.11
